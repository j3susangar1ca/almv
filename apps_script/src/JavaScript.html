<script>
const { createApp, ref, reactive, computed, onMounted, nextTick } = Vue;

/** Envuelve google.script.run en una Promesa para poder usar async/await. */
function gsRun(nombreFuncion, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler((error) => reject(error))
      [nombreFuncion](...args);
  });
}

const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const DIAS_SEMANA_CORTO = ['D', 'L', 'M', 'M', 'J', 'V', 'S']; // Date.getDay(): 0=domingo

createApp({
  setup() {
    const cargando = ref(false);
    const error = ref('');
    const aviso = ref('');
    const pestana = ref('programacion');

    const sesion = ref(null);
    const esAdmin = computed(() => sesion.value && sesion.value.rol === 'ADMINISTRADOR');

    const areas = ref([]);
    const articulos = ref([]);
    const cupos = ref({}); // {codigo_articulo: {acumulado, maximo, pct}} — semáforo de techo (sección 4.1)

    const areaId = ref('');
    const anio = ref(new Date().getFullYear());
    const mes = ref(new Date().getMonth() + 1);

    const cabecera = ref(null);
    const detalle = reactive({}); // clave "codigo|dia" -> cantidad_programada
    const articulosVisibles = ref([]);
    const articuloParaAgregar = ref('');
    const fechaVale = ref('');

    const diasDelMes = computed(() => new Date(anio.value, mes.value, 0).getDate());
    function claveCelda(codigo, dia) { return codigo + '|' + dia; }
    function fechaIso(dia) {
      return anio.value + '-' + String(mes.value).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
    }
    function diaSemana(dia) { return DIAS_SEMANA_CORTO[new Date(anio.value, mes.value - 1, dia).getDay()]; }
    function esFinde(dia) { const d = new Date(anio.value, mes.value - 1, dia).getDay(); return d === 0 || d === 6; }

    const permisoAreaActual = computed(() => {
      if (!sesion.value) return null;
      if (esAdmin.value) return 'APROBACION';
      const asignacion = sesion.value.servicios_asignados.find((s) => String(s.servicio_id) === String(areaId.value));
      return asignacion ? asignacion.permiso : null;
    });
    const puedeEscribir = computed(() => permisoAreaActual.value === 'ESCRITURA' || permisoAreaActual.value === 'APROBACION');
    const puedeEnviar = computed(() => permisoAreaActual.value === 'APROBACION');
    const soloLectura = computed(() => !cabecera.value || cabecera.value.estatus !== 'BORRADOR' || !puedeEscribir.value);

    // ---- Carga inicial ----
    async function cargarSesion() { sesion.value = await gsRun('apiObtenerSesion'); }

    async function cargarCatalogos() {
      const [resAreas, resArticulos] = await Promise.all([
        gsRun('apiListarAreasServicio'), gsRun('apiListarArticulos'),
      ]);
      areas.value = resAreas || [];
      articulos.value = resArticulos || [];
      if (areas.value.length && !areaId.value) areaId.value = areas.value[0].area_id;
    }

    async function cargarCupos() {
      try { cupos.value = await gsRun('apiObtenerCuposArticulos'); }
      catch (e) { cupos.value = {}; }
    }

    async function cargarProgramacion() {
      if (!areaId.value) return;
      cargando.value = true;
      error.value = '';
      try {
        const resp = await gsRun('apiObtenerProgramacionMes', areaId.value, anio.value, mes.value);
        if (!resp) throw new Error('El servidor no devolvió datos de la programación (respuesta vacía).');
        cabecera.value = resp.cabecera;
        Object.keys(detalle).forEach((k) => delete detalle[k]);
        const codigos = new Set();
        resp.detalle.forEach((d) => {
          const dia = Number(d.fecha.split('-')[2]);
          detalle[claveCelda(d.codigo_articulo, dia)] = d.cantidad_programada;
          codigos.add(d.codigo_articulo);
        });
        articulosVisibles.value = Array.from(codigos);
        await cargarCupos();
      } catch (e) {
        error.value = String(e);
      } finally {
        cargando.value = false;
      }
    }

    async function crearProgramacion() {
      cargando.value = true;
      try { await gsRun('apiCrearProgramacionMensual', areaId.value, anio.value, mes.value); await cargarProgramacion(); }
      catch (e) { error.value = String(e); }
      finally { cargando.value = false; }
    }

    function agregarArticuloVisible() {
      if (articuloParaAgregar.value && articulosVisibles.value.indexOf(articuloParaAgregar.value) === -1) {
        articulosVisibles.value.push(articuloParaAgregar.value);
      }
      articuloParaAgregar.value = '';
    }

    function descripcionArticulo(codigo) {
      const a = articulos.value.find((x) => x.codigo_articulo === codigo);
      return a ? a.descripcion + ' · ' + a.unidad_clave : codigo;
    }

    // ---- Guardado con cola + debounce (sección 5: Offline-First & Debounce) ----
    const colaCambios = new Map(); // "codigo|dia" -> {codigo_articulo, fecha, cantidad_programada}
    let temporizadorGuardado = null;
    const estadoSync = ref('guardado'); // 'guardado' | 'sincronizando' | 'error'

    function encolarCambio(codigo, dia, valor) {
      colaCambios.set(claveCelda(codigo, dia), { codigo_articulo: codigo, fecha: fechaIso(dia), cantidad_programada: Number(valor) || 0 });
      estadoSync.value = 'sincronizando';
      if (temporizadorGuardado) clearTimeout(temporizadorGuardado);
      temporizadorGuardado = setTimeout(flushCola, 400);
    }

    async function flushCola() {
      temporizadorGuardado = null;
      if (colaCambios.size === 0 || !cabecera.value) return;
      const cambios = Array.from(colaCambios.values());
      colaCambios.clear();
      try {
        await gsRun('apiGuardarLoteCantidades', cabecera.value.programacion_id, cambios);
        estadoSync.value = 'guardado';
      } catch (e) {
        estadoSync.value = 'error';
        error.value = String(e);
      }
    }

    function onCambiarCelda(codigo, dia) {
      encolarCambio(codigo, dia, detalle[claveCelda(codigo, dia)]);
    }

    // ---- Navegación total por teclado (sección 2.1) ----
    const celdaEditando = reactive({ codigo: '', dia: null, valorAnterior: null });
    function iniciarEdicion(codigo, dia) {
      celdaEditando.codigo = codigo; celdaEditando.dia = dia;
      celdaEditando.valorAnterior = detalle[claveCelda(codigo, dia)];
    }

    function moverFoco(indiceArticulo, dia) {
      if (indiceArticulo < 0 || indiceArticulo >= articulosVisibles.value.length) return;
      if (dia < 1 || dia > diasDelMes.value) return;
      const codigo = articulosVisibles.value[indiceArticulo];
      const el = document.querySelector('input[data-codigo="' + CSS.escape(codigo) + '"][data-dia="' + dia + '"]');
      if (el) { el.focus(); el.select(); }
    }

    function onKeydownCelda(event, codigo, dia) {
      const idx = articulosVisibles.value.indexOf(codigo);
      if (event.key === 'ArrowUp') { event.preventDefault(); moverFoco(idx - 1, dia); }
      else if (event.key === 'ArrowDown') { event.preventDefault(); moverFoco(idx + 1, dia); }
      else if (event.key === 'ArrowLeft' && event.target.selectionStart === 0) { event.preventDefault(); moverFoco(idx, dia - 1); }
      else if (event.key === 'ArrowRight' && event.target.selectionStart === String(event.target.value).length) { event.preventDefault(); moverFoco(idx, dia + 1); }
      else if (event.key === 'Enter') {
        event.preventDefault();
        if (temporizadorGuardado) clearTimeout(temporizadorGuardado);
        flushCola();
        moverFoco(idx + 1, dia);
      } else if (event.key === 'Escape') {
        detalle[claveCelda(codigo, dia)] = celdaEditando.valorAnterior;
        event.target.blur();
      }
      // Tab: se deja el comportamiento nativo del navegador (avanza al siguiente <input>
      // del DOM, que es exactamente el día siguiente de la misma fila).
    }

    // ---- Portapapeles inteligente (sección 2.2): pegar un rango de Excel ----
    function onPasteCelda(event, codigoInicio, diaInicio) {
      const texto = (event.clipboardData || window.clipboardData).getData('text');
      if (!texto) return;
      const pareceTabla = texto.indexOf('\t') !== -1 || texto.indexOf('\n') !== -1;
      if (!pareceTabla && !/^\s*-?\d+(\.\d+)?\s*$/.test(texto)) return; // deja el pegado normal del navegador
      event.preventDefault();

      const indiceInicio = articulosVisibles.value.indexOf(codigoInicio);
      const filas = texto.replace(/\r/g, '').split('\n').filter((linea, i, arr) => !(i === arr.length - 1 && linea === ''));
      filas.forEach((linea, deltaFila) => {
        const codigo = articulosVisibles.value[indiceInicio + deltaFila];
        if (!codigo) return; // no hay más filas visibles hacia abajo
        linea.split('\t').forEach((celda, deltaCol) => {
          const dia = diaInicio + deltaCol;
          if (dia < 1 || dia > diasDelMes.value) return;
          const valor = Number(String(celda).trim().replace(',', '.'));
          if (!Number.isFinite(valor)) return;
          detalle[claveCelda(codigo, dia)] = valor;
          encolarCambio(codigo, dia, valor);
        });
      });
    }

    // ---- Command Palette (Ctrl+K) — sección 2.3 ----
    const paletaAbierta = ref(false);
    const paletaTexto = ref('');
    const inputPaleta = ref(null);
    const filaResaltada = ref('');
    const resultadosPaleta = computed(() => {
      const q = paletaTexto.value.trim().toLowerCase();
      if (!q) return [];
      return articulos.value
        .filter((a) => a.codigo_articulo.toLowerCase().indexOf(q) !== -1 || a.descripcion.toLowerCase().indexOf(q) !== -1)
        .slice(0, 20);
    });
    function abrirPaleta() {
      paletaAbierta.value = true;
      paletaTexto.value = '';
      nextTick(() => inputPaleta.value && inputPaleta.value.focus());
    }
    function seleccionarResultadoPaleta(art) {
      if (articulosVisibles.value.indexOf(art.codigo_articulo) === -1) articulosVisibles.value.push(art.codigo_articulo);
      paletaAbierta.value = false;
      filaResaltada.value = art.codigo_articulo;
      setTimeout(() => { if (filaResaltada.value === art.codigo_articulo) filaResaltada.value = ''; }, 1800);
      nextTick(() => {
        const fila = document.querySelector('tr[data-fila-articulo="' + CSS.escape(art.codigo_articulo) + '"]');
        if (fila) fila.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }
    function manejarAtajoGlobal(event) {
      const combo = (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k';
      if (combo) { event.preventDefault(); abrirPaleta(); }
      else if (event.key === 'Escape' && paletaAbierta.value) { paletaAbierta.value = false; }
    }

    // ---- Micro-métricas: totales, semáforo de techo, sparkline (sección 4) ----
    function totalArticulo(codigo) {
      let total = 0;
      for (let d = 1; d <= diasDelMes.value; d++) total += Number(detalle[claveCelda(codigo, d)]) || 0;
      return total;
    }
    function pctTecho(codigo) {
      const c = cupos.value[codigo];
      return c ? c.pct : null;
    }
    function colorTecho(pct) {
      if (pct === null || pct === undefined) return '';
      if (pct > 0.95) return 'techo-rojo';
      if (pct > 0.75) return 'techo-ambar';
      return 'techo-verde';
    }
    function sparklinePoints(codigo) {
      const ancho = 52, alto = 14;
      const valores = [];
      for (let d = 1; d <= diasDelMes.value; d++) valores.push(Number(detalle[claveCelda(codigo, d)]) || 0);
      const max = Math.max(1, ...valores);
      const paso = ancho / Math.max(1, valores.length - 1);
      return valores.map((v, i) => (i * paso).toFixed(1) + ',' + (alto - (v / max) * alto).toFixed(1)).join(' ');
    }

    // Barra de resumen viva (sección 4.3)
    const totalUnidadesVivo = computed(() => articulosVisibles.value.reduce((acc, c) => acc + totalArticulo(c), 0));
    const totalImporteVivo = computed(() => articulosVisibles.value.reduce((acc, codigo) => {
      const art = articulos.value.find((a) => a.codigo_articulo === codigo);
      return acc + (art && art.precio_unitario ? totalArticulo(codigo) * art.precio_unitario : 0);
    }, 0));

    // ---- Envío: modal de validación previa (Pre-Flight) — sección 6.1 ----
    const modalEnviarAbierto = ref(false);
    const resumenPreEnvio = computed(() => {
      const altoCupo = [];
      articulosVisibles.value.forEach((codigo) => {
        if (totalArticulo(codigo) <= 0) return;
        const pct = pctTecho(codigo);
        if (pct !== null && pct >= 0.90) altoCupo.push({ codigo, descripcion: descripcionArticulo(codigo), pct });
      });
      return {
        totalArticulos: articulosVisibles.value.filter((c) => totalArticulo(c) > 0).length,
        totalUnidades: totalUnidadesVivo.value,
        totalImporte: totalImporteVivo.value,
        altoCupo,
      };
    });
    function abrirModalEnviar() { modalEnviarAbierto.value = true; }
    async function confirmarEnvio() {
      modalEnviarAbierto.value = false;
      cargando.value = true;
      try {
        await gsRun('apiEnviarCarga', cabecera.value.programacion_id);
        aviso.value = 'Carga enviada y consolidada.';
        await cargarProgramacion();
      } catch (e) {
        error.value = String(e);
      } finally {
        cargando.value = false;
      }
    }

    async function reabrirCargaActual() {
      cargando.value = true;
      try { await gsRun('apiReabrirCarga', cabecera.value.programacion_id); aviso.value = 'Carga reabierta.'; await cargarProgramacion(); }
      catch (e) { error.value = String(e); }
      finally { cargando.value = false; }
    }

    async function generarVale() {
      if (!fechaVale.value) { error.value = 'Selecciona una fecha para el vale.'; return; }
      cargando.value = true;
      try {
        const url = await gsRun('apiGenerarValePedido', areaId.value, fechaVale.value);
        aviso.value = 'Vale generado.';
        window.open(url, '_blank');
      } catch (e) { error.value = String(e); }
      finally { cargando.value = false; }
    }

    // ---- Administración ----
    const usuarios = ref([]);
    const consolidadoGeneral = ref([]);
    const nuevoUsuario = reactive({ correo: '', nombre: '', rol: 'CAPTURISTA' });
    const nuevaAsignacion = reactive({ usuario_id: '', area_id: '', permiso: 'ESCRITURA' });

    async function cargarAdmin() {
      if (!esAdmin.value) return;
      cargando.value = true;
      try { [usuarios.value, consolidadoGeneral.value] = await Promise.all([gsRun('apiListarUsuarios'), gsRun('apiListarConsolidadoGeneral')]); }
      catch (e) { error.value = String(e); }
      finally { cargando.value = false; }
    }
    async function crearUsuario() {
      try {
        await gsRun('apiGuardarUsuario', Object.assign({}, nuevoUsuario));
        nuevoUsuario.correo = ''; nuevoUsuario.nombre = ''; nuevoUsuario.rol = 'CAPTURISTA';
        aviso.value = 'Usuario creado.';
        await cargarAdmin();
      } catch (e) { error.value = String(e); }
    }
    async function asignarServicio() {
      try {
        await gsRun('apiAsignarServicio', nuevaAsignacion.usuario_id, nuevaAsignacion.area_id, nuevaAsignacion.permiso);
        aviso.value = 'Servicio asignado.';
        await cargarAdmin();
      } catch (e) { error.value = String(e); }
    }
    async function revocarServicio(usuarioId, areaId2) {
      try { await gsRun('apiRevocarServicio', usuarioId, areaId2); await cargarAdmin(); }
      catch (e) { error.value = String(e); }
    }
    async function cambiarPestana(nombre) {
      pestana.value = nombre;
      if (nombre === 'admin') await cargarAdmin();
    }

    onMounted(async () => {
      window.addEventListener('keydown', manejarAtajoGlobal);
      cargando.value = true;
      try { await cargarSesion(); await cargarCatalogos(); await cargarProgramacion(); }
      catch (e) { error.value = String(e); }
      finally { cargando.value = false; }
    });

    return {
      cargando, error, aviso, pestana, sesion, esAdmin,
      areas, articulos, areaId, anio, mes, MESES,
      cabecera, detalle, diasDelMes, articulosVisibles, articuloParaAgregar, fechaVale,
      soloLectura, puedeEnviar, diaSemana, esFinde,
      cargarProgramacion, crearProgramacion, agregarArticuloVisible,
      descripcionArticulo, generarVale, claveCelda, reabrirCargaActual,
      onCambiarCelda, onKeydownCelda, onPasteCelda, iniciarEdicion, estadoSync,
      paletaAbierta, paletaTexto, inputPaleta, resultadosPaleta, abrirPaleta, seleccionarResultadoPaleta, filaResaltada,
      totalArticulo, pctTecho, colorTecho, sparklinePoints, totalUnidadesVivo, totalImporteVivo,
      modalEnviarAbierto, resumenPreEnvio, abrirModalEnviar, confirmarEnvio,
      usuarios, consolidadoGeneral, nuevoUsuario, nuevaAsignacion,
      crearUsuario, asignarServicio, revocarServicio, cambiarPestana,
    };
  },
  template: `
    <div class="max-w-[1600px] mx-auto px-5 py-6">

      <!-- ===== Encabezado ===== -->
      <header class="flex items-center justify-between mb-5">
        <div>
          <h1 class="titulo-1">Dietología</h1>
          <p class="subtitulo mt-0.5">Hospital Civil de Guadalajara · Fray Antonio Alcalde</p>
        </div>
        <div v-if="sesion" class="flex items-center gap-3">
          <div class="hidden sm:flex items-center gap-1.5 text-xs texto-terciario">
            <svg class="icono" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
            <span>⌘K</span>
          </div>
          <div class="text-right leading-tight">
            <div class="text-sm font-medium">{{ sesion.nombre || sesion.correo }}</div>
            <div class="subtitulo">{{ sesion.rol }}</div>
          </div>
        </div>
      </header>

      <div v-if="error" class="tarjeta px-4 py-3 mb-4 text-sm flex items-start gap-2" style="border-color: rgba(255,59,48,0.25); background: rgba(255,59,48,0.05); color: #b3261e;">
        <svg class="icono flex-shrink-0 mt-0.5" viewBox="0 0 24 24" style="stroke:#ff3b30"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span>{{ error }}</span>
      </div>
      <div v-if="aviso" class="tarjeta px-4 py-3 mb-4 text-sm flex items-start gap-2" style="border-color: rgba(52,199,89,0.25); background: rgba(52,199,89,0.06); color: #1d8a3e;">
        <svg class="icono flex-shrink-0 mt-0.5" viewBox="0 0 24 24" style="stroke:#34c759"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
        <span>{{ aviso }}</span>
      </div>

      <!-- ===== Navegación segmentada ===== -->
      <div class="segmentado mb-5">
        <button @click="cambiarPestana('programacion')" :class="{activo: pestana==='programacion'}">Programación</button>
        <button v-if="esAdmin" @click="cambiarPestana('admin')" :class="{activo: pestana==='admin'}">Administración</button>
      </div>

      <!-- ===== Pestaña: Programación ===== -->
      <div v-if="pestana==='programacion'">
        <div class="tarjeta flex flex-wrap gap-4 items-end px-4 py-3.5 mb-4">
          <div>
            <label class="block text-[11px] font-medium texto-terciario mb-1">Servicio</label>
            <select v-model="areaId" @change="cargarProgramacion" class="campo">
              <option v-for="a in areas" :key="a.area_id" :value="a.area_id">{{ a.nombre }}</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-medium texto-terciario mb-1">Año</label>
            <input type="number" v-model.number="anio" @change="cargarProgramacion" class="campo w-24">
          </div>
          <div>
            <label class="block text-[11px] font-medium texto-terciario mb-1">Mes</label>
            <select v-model.number="mes" @change="cargarProgramacion" class="campo">
              <option v-for="(nombre, i) in MESES" :key="i" :value="i + 1">{{ nombre }}</option>
            </select>
          </div>
          <span v-if="cabecera" class="insignia" :class="cabecera.estatus==='BORRADOR' ? 'insignia-ambar' : 'insignia-verde'">
            <span class="punto-sync" :style="{background: cabecera.estatus==='BORRADOR' ? 'var(--color-advertencia)' : 'var(--color-exito)'}"></span>
            {{ cabecera.estatus==='BORRADOR' ? 'Borrador' : 'Enviada y bloqueada' }}
          </span>
          <span v-if="cargando" class="text-xs texto-terciario">Cargando…</span>

          <div v-if="cabecera && !soloLectura" class="flex items-center gap-1.5 text-xs texto-terciario ml-auto">
            <span class="punto-sync" :class="{'bg-emerald-500': estadoSync==='guardado'}"
                  :style="{background: estadoSync==='guardado' ? 'var(--color-exito)' : estadoSync==='sincronizando' ? 'var(--color-advertencia)' : 'var(--color-peligro)'}"></span>
            {{ estadoSync==='guardado' ? 'Guardado' : estadoSync==='sincronizando' ? 'Sincronizando…' : 'Error de conexión' }}
          </div>
        </div>

        <!-- Barra de resumen viva — sección 4.3 -->
        <div v-if="cabecera" class="sticky top-3 z-10 barra-glass rounded-2xl px-5 py-3 mb-4 flex flex-wrap gap-x-8 gap-y-1">
          <div>
            <div class="text-[10px] font-medium texto-terciario uppercase tracking-wide">Artículos</div>
            <div class="text-base font-semibold mono">{{ articulosVisibles.filter(c => totalArticulo(c) > 0).length }}</div>
          </div>
          <div>
            <div class="text-[10px] font-medium texto-terciario uppercase tracking-wide">Unidades</div>
            <div class="text-base font-semibold mono">{{ totalUnidadesVivo }}</div>
          </div>
          <div>
            <div class="text-[10px] font-medium texto-terciario uppercase tracking-wide">Presupuesto Programado</div>
            <div class="text-base font-semibold mono" style="color: var(--color-acento);">\${{ totalImporteVivo.toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2}) }} <span class="text-xs font-normal texto-terciario">MXN</span></div>
          </div>
        </div>

        <div v-if="!cabecera && !cargando" class="tarjeta px-6 py-10 mb-4 text-center">
          <p class="text-sm texto-secundario mb-3">No existe programación para este servicio/mes todavía.</p>
          <button @click="crearProgramacion" class="boton boton-primario">Crear programación</button>
        </div>

        <div v-if="cabecera" class="tarjeta p-4 mb-4">
          <div class="flex flex-wrap gap-2.5 items-end mb-3.5">
            <div class="flex-1 min-w-[240px]">
              <label class="block text-[11px] font-medium texto-terciario mb-1">Agregar artículo</label>
              <select v-model="articuloParaAgregar" :disabled="soloLectura" class="campo w-full max-w-md">
                <option value="" disabled>Selecciona un artículo…</option>
                <option v-for="a in articulos" :key="a.codigo_articulo" :value="a.codigo_articulo">{{ a.codigo_articulo }} — {{ a.descripcion }}</option>
              </select>
            </div>
            <button @click="agregarArticuloVisible" :disabled="soloLectura" class="boton boton-secundario">
              <svg class="icono" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              Agregar
            </button>
            <button @click="abrirPaleta" class="boton boton-fantasma">
              <svg class="icono" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              Buscar
            </button>
          </div>

          <div class="overflow-x-auto max-h-[62vh] rounded-xl border" style="border-color: var(--color-borde-sutil);" :class="{'opacity-90': soloLectura}">
            <table class="text-xs tabla-captura freeze-panes w-full">
              <thead class="sticky top-0">
                <tr>
                  <th class="col-fija-izq px-3 py-2 text-left" style="min-width:230px">Artículo</th>
                  <th v-for="d in diasDelMes" :key="d" :class="['py-2 text-center font-normal', esFinde(d) ? 'dia-finde' : '']" style="min-width:2.3rem">
                    <div class="font-semibold">{{ d }}</div><div class="text-[9px] texto-terciario">{{ diaSemana(d) }}</div>
                  </th>
                  <th class="col-fija-der px-3 py-2 text-left" style="min-width:9.5rem">Total / Techo / Tendencia</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="codigo in articulosVisibles" :key="codigo" :data-fila-articulo="codigo"
                    :class="{'fila-resaltada': filaResaltada===codigo}">
                  <td class="col-fija-izq px-3 py-1.5 whitespace-nowrap bg-inherit" :title="descripcionArticulo(codigo)">{{ descripcionArticulo(codigo) }}</td>
                  <td v-for="d in diasDelMes" :key="d" :class="['p-0.5 text-center', esFinde(d) ? 'dia-finde' : '']">
                    <input type="number" min="0" :disabled="soloLectura" :data-codigo="codigo" :data-dia="d"
                           class="campo-celda"
                           v-model.number="detalle[claveCelda(codigo, d)]"
                           @focus="iniciarEdicion(codigo, d)"
                           @input="onCambiarCelda(codigo, d)"
                           @keydown="onKeydownCelda($event, codigo, d)"
                           @paste="onPasteCelda($event, codigo, d)">
                  </td>
                  <td class="col-fija-der bg-inherit px-3 py-1.5 align-top" style="min-width:9.5rem">
                    <div class="flex items-center justify-between text-[11px] mono">
                      <span class="font-semibold">{{ totalArticulo(codigo) }}</span>
                      <span v-if="pctTecho(codigo)!==null" class="texto-terciario">{{ (pctTecho(codigo)*100).toFixed(0) }}%</span>
                    </div>
                    <div v-if="pctTecho(codigo)!==null" class="barra-techo mt-1 mb-1.5">
                      <div :class="colorTecho(pctTecho(codigo))" :style="{width: Math.min(100, pctTecho(codigo)*100) + '%'}"></div>
                    </div>
                    <svg width="52" height="14" style="color: var(--color-texto-terciario);"><polyline :points="sparklinePoints(codigo)" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="flex gap-2 mt-4">
            <button v-if="cabecera && puedeEnviar && cabecera.estatus==='BORRADOR'" @click="abrirModalEnviar" class="boton boton-exito">
              <svg class="icono" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              Revisar y enviar
            </button>
            <button v-if="cabecera && esAdmin && cabecera.estatus==='ENVIADO'" @click="reabrirCargaActual" class="boton boton-advertencia">
              <svg class="icono" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
              Reabrir carga
            </button>
          </div>
        </div>

        <div v-if="cabecera" class="tarjeta p-4">
          <h2 class="titulo-2 mb-3">{{ cabecera.estatus==='BORRADOR' ? 'Vale de pedido al almacén' : 'Descargar PDF / Vale' }}</h2>
          <div class="flex gap-2 items-end">
            <div>
              <label class="block text-[11px] font-medium texto-terciario mb-1">Fecha</label>
              <input type="date" v-model="fechaVale" class="campo">
            </div>
            <button @click="generarVale" class="boton boton-primario">
              <svg class="icono" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
              Generar PDF
            </button>
          </div>
        </div>
      </div>

      <!-- ===== Pestaña: Administración (sólo ADMINISTRADOR) ===== -->
      <div v-if="pestana==='admin' && esAdmin">
        <div class="tarjeta p-4 mb-4">
          <h2 class="titulo-2 mb-3">Usuarios</h2>
          <table class="text-xs w-full mb-4 tabla-captura">
            <thead><tr class="text-left"><th class="py-2 px-2">Correo</th><th class="py-2">Nombre</th><th class="py-2">Rol</th><th class="py-2">Servicios asignados</th></tr></thead>
            <tbody>
              <tr v-for="u in usuarios" :key="u.usuario_id">
                <td class="py-2 px-2">{{ u.correo }}</td><td class="py-2">{{ u.nombre }}</td><td class="py-2">{{ u.rol }}</td>
                <td class="py-2">
                  <span v-for="s in u.servicios_asignados" :key="s.area_id" class="insignia insignia-gris mr-1 mb-1">
                    {{ s.nombre }} · {{ s.permiso }}
                    <button @click="revocarServicio(u.usuario_id, s.area_id)" class="ml-0.5 texto-terciario hover:text-red-500">×</button>
                  </span>
                </td>
              </tr>
            </tbody>
          </table>

          <div class="flex flex-wrap gap-2 items-end pt-3.5" style="border-top: 1px solid var(--color-borde-sutil);">
            <input v-model="nuevoUsuario.correo" placeholder="correo@hospital.org" class="campo">
            <input v-model="nuevoUsuario.nombre" placeholder="Nombre" class="campo">
            <select v-model="nuevoUsuario.rol" class="campo">
              <option>CAPTURISTA</option><option>SUPERVISOR</option><option>ADMINISTRADOR</option>
            </select>
            <button @click="crearUsuario" class="boton boton-primario">Crear usuario</button>
          </div>

          <div class="flex flex-wrap gap-2 items-end pt-3.5 mt-3.5" style="border-top: 1px solid var(--color-borde-sutil);">
            <select v-model="nuevaAsignacion.usuario_id" class="campo">
              <option value="" disabled>Usuario…</option>
              <option v-for="u in usuarios" :key="u.usuario_id" :value="u.usuario_id">{{ u.correo }}</option>
            </select>
            <select v-model="nuevaAsignacion.area_id" class="campo">
              <option value="" disabled>Servicio…</option>
              <option v-for="a in areas" :key="a.area_id" :value="a.area_id">{{ a.nombre }}</option>
            </select>
            <select v-model="nuevaAsignacion.permiso" class="campo">
              <option>LECTURA</option><option>ESCRITURA</option><option>APROBACION</option>
            </select>
            <button @click="asignarServicio" class="boton boton-primario">Asignar servicio</button>
          </div>
        </div>

        <div class="tarjeta p-4">
          <h2 class="titulo-2 mb-3">Consolidado General <span class="texto-terciario font-normal">({{ consolidadoGeneral.length }})</span></h2>
          <div class="overflow-x-auto max-h-[50vh] rounded-xl border" style="border-color: var(--color-borde-sutil);">
            <table class="text-xs w-full tabla-captura">
              <thead class="sticky top-0"><tr class="text-left">
                <th class="px-3 py-2">Fecha</th><th class="py-2">Servicio</th><th class="py-2">Artículo</th><th class="py-2">Cantidad</th><th class="py-2">Enviado por</th>
              </tr></thead>
              <tbody>
                <tr v-for="c in consolidadoGeneral" :key="c.consolidado_id">
                  <td class="px-3 py-1.5">{{ c.fecha }}</td><td class="py-1.5">{{ c.nombre_area }}</td>
                  <td class="py-1.5">{{ c.codigo_articulo }} — {{ c.descripcion_articulo }}</td>
                  <td class="py-1.5 mono">{{ c.cantidad_programada }}</td><td class="py-1.5">{{ c.correo_envio }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ===== Command Palette (Ctrl+K) — sección 2.3 ===== -->
      <div v-if="paletaAbierta" class="fixed inset-0 fondo-modal flex items-start justify-center pt-24 z-50" @click.self="paletaAbierta=false">
        <div class="panel-modal w-full max-w-lg overflow-hidden">
          <div class="flex items-center gap-2 px-4 border-b" style="border-color: var(--color-borde-sutil);">
            <svg class="icono texto-terciario" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input ref="inputPaleta" v-model="paletaTexto" placeholder="Código o descripción del insumo…"
                   class="w-full py-3.5 text-sm outline-none border-none bg-transparent">
            <kbd class="text-[10px] texto-terciario px-1.5 py-0.5 rounded" style="background: var(--color-bg-secundario)">Esc</kbd>
          </div>
          <div class="max-h-80 overflow-y-auto py-1.5">
            <button v-for="a in resultadosPaleta" :key="a.codigo_articulo" @click="seleccionarResultadoPaleta(a)"
                    class="block w-full text-left px-4 py-2 text-sm hover:bg-[var(--color-bg-secundario)] transition-colors">
              <span class="mono texto-terciario">{{ a.codigo_articulo }}</span> — {{ a.descripcion }}
            </button>
            <div v-if="paletaTexto && resultadosPaleta.length===0" class="px-4 py-6 text-sm texto-terciario text-center">Sin resultados.</div>
          </div>
        </div>
      </div>

      <!-- ===== Modal de validación previa al envío — sección 6.1 ===== -->
      <div v-if="modalEnviarAbierto" class="fixed inset-0 fondo-modal flex items-center justify-center z-50 px-4">
        <div class="panel-modal w-full max-w-md p-6">
          <h3 class="titulo-2 mb-4">Confirmar envío de la programación</h3>
          <div class="grid grid-cols-3 gap-3 mb-4">
            <div class="tarjeta px-3 py-2.5" style="box-shadow:none;">
              <div class="text-[10px] font-medium texto-terciario uppercase">Artículos</div>
              <div class="text-lg font-semibold mono">{{ resumenPreEnvio.totalArticulos }}</div>
            </div>
            <div class="tarjeta px-3 py-2.5" style="box-shadow:none;">
              <div class="text-[10px] font-medium texto-terciario uppercase">Unidades</div>
              <div class="text-lg font-semibold mono">{{ resumenPreEnvio.totalUnidades }}</div>
            </div>
            <div class="tarjeta px-3 py-2.5" style="box-shadow:none;">
              <div class="text-[10px] font-medium texto-terciario uppercase">Presupuesto</div>
              <div class="text-lg font-semibold mono" style="color: var(--color-acento);">\${{ resumenPreEnvio.totalImporte.toLocaleString('es-MX', {maximumFractionDigits:0}) }}</div>
            </div>
          </div>
          <div v-if="resumenPreEnvio.altoCupo.length" class="rounded-xl p-3 mb-4 text-xs" style="background: rgba(255,159,10,0.08); border: 1px solid rgba(255,159,10,0.25);">
            <p class="font-semibold mb-1.5 flex items-center gap-1.5" style="color:#b26500">
              <svg class="icono" viewBox="0 0 24 24" style="stroke:#b26500; width:0.9rem; height:0.9rem;"><path d="M12 9v4M12 17h.01M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
              {{ resumenPreEnvio.altoCupo.length }} insumo(s) por encima del 90% de su cupo adjudicado
            </p>
            <ul class="space-y-0.5" style="color:#8a5a00">
              <li v-for="a in resumenPreEnvio.altoCupo" :key="a.codigo">— {{ a.descripcion }} ({{ (a.pct*100).toFixed(0) }}%)</li>
            </ul>
          </div>
          <p class="text-xs texto-secundario mb-5 leading-relaxed">Al confirmar, la información se consolidará en el Resumen Global y la edición quedará bloqueada hasta que un administrador la reabra.</p>
          <div class="flex justify-end gap-2">
            <button @click="modalEnviarAbierto=false" class="boton boton-secundario">Cancelar</button>
            <button @click="confirmarEnvio" class="boton boton-exito">Confirmar y enviar</button>
          </div>
        </div>
      </div>
    </div>
  `,
}).mount('#app');
</script>
