<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* ============================================================
     Sistema de diseño — estética Apple (macOS / iOS): fondo blanco,
     tipografía del sistema, acentos de color con propósito, esquinas
     continuas, sombras difusas y muy sutiles, transiciones suaves.
     ============================================================ */
  :root {
    --color-bg: #ffffff;
    --color-bg-secundario: #f5f5f7;      /* gris Apple característico */
    --color-borde: #e5e5ea;
    --color-borde-sutil: #f0f0f2;
    --color-texto: #1d1d1f;
    --color-texto-secundario: #6e6e73;
    --color-texto-terciario: #86868b;

    --color-acento: #0071e3;             /* azul Apple */
    --color-acento-hover: #0077ed;
    --color-acento-activo: #006edb;
    --color-exito: #34c759;
    --color-advertencia: #ff9f0a;
    --color-peligro: #ff3b30;

    --radio-sm: 8px;
    --radio-md: 12px;
    --radio-lg: 16px;
    --radio-pill: 980px;

    --sombra-card: 0 1px 2px rgba(0,0,0,0.04), 0 2px 12px rgba(0,0,0,0.04);
    --sombra-flotante: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.06);
    --sombra-modal: 0 20px 60px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);

    --transicion: 180ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--color-bg);
    color: var(--color-texto);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  ::selection { background: rgba(0,113,227,0.18); }

  /* ---- Tipografía ---- */
  .titulo-1 { font-size: 1.375rem; font-weight: 650; letter-spacing: -0.02em; color: var(--color-texto); }
  .titulo-2 { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; color: var(--color-texto); }
  .subtitulo { font-size: 0.8125rem; color: var(--color-texto-secundario); font-weight: 400; }
  .texto-terciario { color: var(--color-texto-terciario); }
  .mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* ---- Tarjetas ---- */
  .tarjeta {
    background: var(--color-bg);
    border: 1px solid var(--color-borde-sutil);
    border-radius: var(--radio-lg);
    box-shadow: var(--sombra-card);
  }

  /* ---- Botones ---- */
  .boton {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem;
    font-size: 0.8125rem; font-weight: 590; letter-spacing: -0.005em;
    padding: 0.5rem 0.9rem; border-radius: var(--radio-pill);
    transition: transform var(--transicion), background var(--transicion), opacity var(--transicion), box-shadow var(--transicion);
    cursor: pointer; border: none; white-space: nowrap;
  }
  .boton:active { transform: scale(0.97); }
  .boton:disabled { opacity: 0.4; cursor: default; transform: none; }

  .boton-primario { background: var(--color-acento); color: #fff; }
  .boton-primario:hover:not(:disabled) { background: var(--color-acento-hover); }
  .boton-primario:active:not(:disabled) { background: var(--color-acento-activo); }

  .boton-exito { background: var(--color-exito); color: #fff; }
  .boton-exito:hover:not(:disabled) { filter: brightness(1.05); }

  .boton-advertencia { background: var(--color-advertencia); color: #fff; }
  .boton-advertencia:hover:not(:disabled) { filter: brightness(1.05); }

  .boton-secundario {
    background: var(--color-bg-secundario); color: var(--color-texto);
  }
  .boton-secundario:hover:not(:disabled) { background: #e8e8ed; }

  .boton-fantasma {
    background: transparent; color: var(--color-acento); padding-left: 0.5rem; padding-right: 0.5rem;
  }
  .boton-fantasma:hover:not(:disabled) { background: rgba(0,113,227,0.08); }

  /* ---- Campos de formulario ---- */
  .campo {
    background: var(--color-bg-secundario);
    border: 1px solid transparent;
    border-radius: var(--radio-sm);
    padding: 0.45rem 0.7rem;
    font-size: 0.8125rem;
    color: var(--color-texto);
    transition: background var(--transicion), border-color var(--transicion), box-shadow var(--transicion);
  }
  .campo:focus {
    outline: none; background: var(--color-bg);
    border-color: var(--color-acento);
    box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
  }
  .campo:disabled { color: var(--color-texto-terciario); }
  .campo-celda {
    width: 3.4rem; text-align: right; padding: 0.3rem 0.4rem; border-radius: 6px;
    background: transparent; border: 1px solid transparent; font-size: 0.75rem;
  }
  .campo-celda:hover:not(:disabled) { background: var(--color-bg-secundario); }
  .campo-celda:focus {
    background: #fff; border-color: var(--color-acento);
    box-shadow: 0 0 0 3px rgba(0,113,227,0.15); outline: none;
  }
  .campo-celda:disabled { background: transparent; color: var(--color-texto-terciario); }

  /* ---- Control segmentado (tabs estilo iOS) ---- */
  .segmentado {
    display: inline-flex; background: var(--color-bg-secundario); border-radius: var(--radio-md);
    padding: 3px; gap: 2px;
  }
  .segmentado button {
    border: none; background: transparent; font-size: 0.8125rem; font-weight: 560;
    padding: 0.4rem 0.85rem; border-radius: calc(var(--radio-md) - 3px);
    color: var(--color-texto-secundario); transition: all var(--transicion); cursor: pointer;
  }
  .segmentado button.activo { background: #fff; color: var(--color-texto); box-shadow: var(--sombra-card); }

  /* ---- Insignias / badges ---- */
  .insignia {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-size: 0.6875rem; font-weight: 620; letter-spacing: 0.01em;
    padding: 0.25rem 0.6rem; border-radius: var(--radio-pill);
  }
  .insignia-ambar { background: rgba(255,159,10,0.14); color: #b26500; }
  .insignia-verde { background: rgba(52,199,89,0.14); color: #1d8a3e; }
  .insignia-gris { background: var(--color-bg-secundario); color: var(--color-texto-secundario); }

  /* ---- Punto de estado (sync) ---- */
  .punto-sync { width: 6px; height: 6px; border-radius: 50%; display: inline-block; transition: background var(--transicion); }

  /* ---- Iconos SVG en línea ---- */
  .icono { width: 1rem; height: 1rem; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ---- Barra flotante translúcida (glass), estilo macOS ---- */
  .barra-glass {
    background: rgba(255,255,255,0.78);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border: 1px solid var(--color-borde-sutil);
    box-shadow: var(--sombra-flotante);
  }

  /* ---- Tabla de captura de alta densidad ---- */
  .tabla-captura { border-collapse: separate; border-spacing: 0; }
  .tabla-captura thead th {
    font-size: 0.6875rem; font-weight: 600; color: var(--color-texto-secundario);
    text-transform: none; letter-spacing: 0; background: var(--color-bg-secundario);
    border-bottom: 1px solid var(--color-borde);
  }
  .tabla-captura tbody tr { border-bottom: 1px solid var(--color-borde-sutil); transition: background var(--transicion); }
  .tabla-captura tbody tr:hover { background: #fbfbfd; }
  .tabla-captura tbody tr:last-child { border-bottom: none; }

  table.freeze-panes th.col-fija-izq,
  table.freeze-panes td.col-fija-izq { position: sticky; left: 0; background: inherit; z-index: 1; }
  table.freeze-panes th.col-fija-der,
  table.freeze-panes td.col-fija-der { position: sticky; right: 0; background: inherit; z-index: 1; }
  table.freeze-panes thead th { z-index: 2; }
  table.freeze-panes thead th.col-fija-izq,
  table.freeze-panes thead th.col-fija-der { z-index: 3; }

  .dia-finde { background-color: rgba(245, 245, 247, 0.6); }

  .fila-resaltada { animation: resaltar-fila 1.8s ease-out; }
  @keyframes resaltar-fila { 0% { background-color: rgba(0,113,227,0.12); } 100% { background-color: transparent; } }

  /* ---- Semáforo de techo presupuestal ---- */
  .barra-techo { height: 3px; border-radius: 2px; background: var(--color-borde); overflow: hidden; }
  .barra-techo > div { height: 100%; transition: width var(--transicion); }
  .techo-verde { background-color: var(--color-exito); }
  .techo-ambar { background-color: var(--color-advertencia); }
  .techo-rojo { background-color: var(--color-peligro); animation: pulso-rojo 1.3s ease-in-out infinite; }
  @keyframes pulso-rojo { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* ---- Modales ---- */
  .fondo-modal {
    background: rgba(0,0,0,0.28); backdrop-filter: blur(2px);
    animation: aparecer-fondo 160ms ease-out;
  }
  .panel-modal {
    background: #fff; border-radius: var(--radio-lg); box-shadow: var(--sombra-modal);
    animation: aparecer-modal 200ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes aparecer-fondo { from { opacity: 0; } to { opacity: 1; } }
  @keyframes aparecer-modal { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }

  /* Scrollbar discreta */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #b8b8bd; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
